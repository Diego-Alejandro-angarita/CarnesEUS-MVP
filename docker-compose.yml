services:
  db:
    image: postgres:16-alpine
    container_name: carneseus-db
    environment:
      POSTGRES_DB: carneseus
      POSTGRES_USER: carneseus
      POSTGRES_PASSWORD: carneseus
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carneseus -d carneseus"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: carneseus-backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      # 8001 en el host: el 8000 suele estar ocupado por otras
      # aplicaciones. Dentro del contenedor sigue siendo 8000.
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      # Dentro de la red de compose el host de la base es "db", no localhost.
      DATABASE_URL: postgres://carneseus:carneseus@db:5432/carneseus
      DJANGO_SETTINGS_MODULE: config.settings.dev
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: carneseus-frontend
    volumes:
      - ./frontend:/app
      # Anonimo: conserva los node_modules de la imagen y evita que el
      # directorio del host los tape.
      - /app/node_modules
    environment:
      # Dentro de compose, "localhost" seria el propio contenedor del frontend.
      # El proxy tiene que apuntar al servicio backend por su nombre de red.
      BACKEND_URL: http://backend:8000
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  postgres_data:
