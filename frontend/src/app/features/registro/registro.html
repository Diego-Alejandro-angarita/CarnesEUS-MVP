<main class="registro">
  <h1>Crear cuenta</h1>

  @if (exito()) {
    <p class="mensaje mensaje--ok">
      Cuenta creada correctamente. Ya puedes iniciar sesion.
    </p>
  } @else {
    <form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
      <label for="first_name">Nombre</label>
      <input id="first_name" type="text" formControlName="first_name" autocomplete="given-name" />

      <label for="last_name">Apellido</label>
      <input id="last_name" type="text" formControlName="last_name" autocomplete="family-name" />

      <label for="email">Correo electronico</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />

      <label for="telefono">Telefono (opcional)</label>
      <input id="telefono" type="tel" formControlName="telefono" autocomplete="tel" />

      <label for="password">Contrasena</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password" />

      <label for="password_confirmacion">Confirmar contrasena</label>
      <input
        id="password_confirmacion"
        type="password"
        formControlName="password_confirmacion"
        autocomplete="new-password"
      />

      @if (errorGeneral()) {
        <p class="mensaje mensaje--error">{{ errorGeneral() }}</p>
      }

      <button type="submit" [disabled]="enviando()">
        {{ enviando() ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="enlace-alterno">
      Ya tienes cuenta? <a routerLink="/login">Inicia sesion</a>
    </p>
  }
</main>
