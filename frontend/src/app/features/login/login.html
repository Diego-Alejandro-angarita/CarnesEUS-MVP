<main class="login">
  <div class="tarjeta-login">
    <h1>Iniciar sesion</h1>
    <p class="subtitulo">Accede a tu cuenta para hacer pedidos</p>

    <form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
      <label for="email">Correo electronico</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="tucorreo@ejemplo.com"
      />

      <label for="password">Contrasena</label>
      <div class="campo-password">
        <input
          id="password"
          [type]="mostrarPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="********"
        />
        <button type="button" (click)="alternarPassword()">
          {{ mostrarPassword() ? 'Ocultar' : 'Mostrar' }}
        </button>
      </div>

      @if (errorGeneral()) {
        <p class="mensaje mensaje--error">{{ errorGeneral() }}</p>
      }

      <button type="submit" class="boton-entrar" [disabled]="enviando()">
        {{ enviando() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <hr />

    <p class="enlace-alterno">No tienes cuenta? <a routerLink="/registro">Registrate</a></p>
  </div>
</main>
