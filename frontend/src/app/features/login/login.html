<main class="login">
  <h1>Iniciar sesion</h1>

  <form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
    <label for="email">Correo electronico</label>
    <input id="email" type="email" formControlName="email" autocomplete="email" />

    <label for="password">Contrasena</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />

    @if (errorGeneral()) {
      <p class="mensaje mensaje--error">{{ errorGeneral() }}</p>
    }

    <button type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Iniciando sesion...' : 'Iniciar sesion' }}
    </button>
  </form>

  <p class="enlace-alterno">
    No tienes cuenta? <a routerLink="/registro">Registrate</a>
  </p>
</main>
