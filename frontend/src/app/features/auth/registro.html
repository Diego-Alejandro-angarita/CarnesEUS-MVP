<div class="auth">
  <div class="auth__tarjeta tarjeta">
    <h1>Crear cuenta</h1>
    <p class="auth__intro">Solo toma un minuto.</p>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <form (ngSubmit)="enviar()" #formulario="ngForm">
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" name="nombre" type="text" autocomplete="name" required [(ngModel)]="datos.nombre_completo" />
      </div>

      <div class="campo">
        <label for="email">Correo electronico</label>
        <input id="email" name="email" type="email" autocomplete="email" required [(ngModel)]="datos.email" />
      </div>

      <div class="campo">
        <label for="telefono">Telefono</label>
        <input id="telefono" name="telefono" type="tel" autocomplete="tel" [(ngModel)]="datos.telefono" />
      </div>

      <div class="campo">
        <label for="password">Contrasena</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" [(ngModel)]="datos.password" />
      </div>

      <div class="campo">
        <label for="password2">Repite la contrasena</label>
        <input id="password2" name="password2" type="password" autocomplete="new-password" required [(ngModel)]="datos.password2" />
      </div>

      <button class="boton auth__boton" type="submit" [disabled]="enviando() || formulario.invalid">
        {{ enviando() ? 'Creando...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="auth__pie">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesion</a></p>
  </div>
</div>
