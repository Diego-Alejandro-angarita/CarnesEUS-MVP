<header class="cabecera">
  <div class="cabecera__barra">
    <a class="cabecera__marca" routerLink="/productos">
      <span class="cabecera__sello" aria-hidden="true">CE</span>
      CarnesEUs
    </a>
    <nav class="cabecera__nav">
      @if (!auth.verificando()) {
        @if (auth.usuario(); as usuario) {
          <span class="cabecera__usuario">
            <span class="cabecera__sello" aria-hidden="true">{{ usuario.first_name.charAt(0) }}</span>
            {{ usuario.first_name }}
          </span>
          <button type="button" class="cabecera__enlace cabecera__salir" (click)="salir()">
            Salir
          </button>
        } @else {
          <a class="cabecera__enlace" routerLink="/login">Iniciar sesion</a>
          <a class="cabecera__enlace" routerLink="/registro">Crear cuenta</a>
        }
      }
      <a routerLink="/admin/productos">Administrar</a>
      <a class="cabecera__carrito" routerLink="/carrito">
        Carrito
        @if (cantidadCarrito() > 0) {
          <span class="cabecera__contador" aria-label="productos en el carrito">
            {{ cantidadCarrito() }}
          </span>
        }
      </a>
    </nav>
  </div>
  <p class="cabecera__servicio">
    <span>Envio en 24 horas</span>
    <span>Lun&ndash;Sab 8:00&ndash;20:00</span>
  </p>
</header>

<router-outlet />
