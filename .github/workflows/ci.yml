name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      # Las pruebas necesitan Postgres de verdad: el proyecto usa tipos y
      # restricciones que SQLite no reproduce.
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: carneseus
          POSTGRES_USER: carneseus
          POSTGRES_PASSWORD: carneseus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carneseus -d carneseus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://carneseus:carneseus@localhost:5432/carneseus
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: llave-solo-para-ci

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Instalar dependencias
        run: pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Pruebas (pytest)
        run: pytest

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Pruebas
        run: npm test
